<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:" />
    <title>PR Deck</title>
    <style>
      :root { color-scheme: light dark; --bg: #fafafa; --fg: #18181b; --muted: #71717a; --primary: #6366f1; }
      @media (prefers-color-scheme: dark) { :root { --bg: #09090b; --fg: #fafafa; --muted: #a1a1aa; --primary: #818cf8; } }
      html, body { height: 100%; margin: 0; }
      body { display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--fg);
        font: 14px -apple-system, BlinkMacSystemFont, system-ui, sans-serif; -webkit-user-select: none; -webkit-app-region: drag; }
      main { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
      .lock { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center;
        background: color-mix(in oklch, var(--primary) 15%, transparent); color: var(--primary); }
      h1 { font-size: 18px; margin: 4px 0 0; }
      p { margin: 0; color: var(--muted); max-width: 320px; }
      button { -webkit-app-region: no-drag; margin-top: 6px; padding: 8px 18px; border: 0; border-radius: 8px;
        background: var(--primary); color: white; font: inherit; font-weight: 600; cursor: pointer; }
      button:disabled { opacity: .6; cursor: default; }
      .err { color: #ef4444; min-height: 1em; font-size: 12px; }
    </style>
  </head>
  <body>
    <main>
      <div class="lock">
        <svg width="28" height="28" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M208 80h-32V56a48 48 0 0 0-96 0v24H48a16 16 0 0 0-16 16v112a16 16 0 0 0 16 16h160a16 16 0 0 0 16-16V96a16 16 0 0 0-16-16ZM96 56a32 32 0 0 1 64 0v24H96Zm112 152H48V96h160v112Zm-68-56a12 12 0 1 1-12-12 12 12 0 0 1 12 12Z"/></svg>
      </div>
      <h1>PR Deck is locked</h1>
      <p>Unlock with Touch ID or your Mac password to see your pull requests, Jira issues and Slack.</p>
      <button id="unlock" autofocus>Unlock</button>
      <div class="err" id="err"></div>
    </main>
    <script>
      const btn = document.getElementById('unlock')
      const err = document.getElementById('err')
      async function go() {
        btn.disabled = true
        err.textContent = ''
        const r = await window.prdeckLock.unlock()
        if (!r.ok) err.textContent = r.message || 'Not unlocked'
        btn.disabled = false
      }
      btn.addEventListener('click', go)
      // Ask right away when the lock screen opens
      go()
    </script>
  </body>
</html>
